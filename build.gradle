plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.1.20'
group = 'com.xxsx.earthhuman'
base.archivesName = 'earth-human-neoforge-26.1.2'
def clientRunDirectory = providers.gradleProperty('clientRunDirectory').orElse('runs/client')
def serverRunDirectory = providers.gradleProperty('serverRunDirectory').orElse('runs/server')

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = '26.1.2.124'

    runs {
        client {
            client()
            gameDirectory = project.file(clientRunDirectory.get())
            if (project.hasProperty('quickPlayWorld')) {
                programArgument("--quickPlaySingleplayer=${project.property('quickPlayWorld')}")
                programArgument('--width')
                programArgument('640')
                programArgument('--height')
                programArgument('480')
            }
        }
        server {
            server()
            gameDirectory = project.file(serverRunDirectory.get())
            programArgument('--nogui')
        }
    }

    mods {
        earth_human {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'earth_human',
            'Specification-Vendor'    : 'xxsx',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'xxsx'
        ])
    }
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.named('test') {
    useJUnitPlatform()
}
